<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>BR3 Tech — Sem Conexão</title>
    <meta name="theme-color" content="#090d16" />
    <style>
      :root {
        --bg: #090d16;
        --card: rgba(15, 23, 42, 0.85);
        --border: rgba(148, 163, 184, 0.2);
        --primary: #06b6d4;
        --text: #f8fafc;
        --muted: #94a3b8;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        background-image: radial-gradient(circle at 50% 20%, rgba(6, 182, 212, 0.12) 0%, transparent 60%);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1.25rem;
        padding: 2.5rem 2rem;
        max-width: 440px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        backdrop-filter: blur(16px);
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.5rem;
        border-radius: 1rem;
        background: rgba(6, 182, 212, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary);
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 700;
        margin-bottom: 0.75rem;
        letter-spacing: -0.02em;
      }
      p {
        font-size: 0.92rem;
        color: var(--muted);
        line-height: 1.55;
        margin-bottom: 1.75rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        background: var(--primary);
        color: #041019;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 0.75rem 1.75rem;
        border-radius: 0.65rem;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
        box-shadow: 0 4px 14px rgba(6, 182, 212, 0.35);
      }
      .btn:active {
        transform: scale(0.97);
      }
      .status {
        margin-top: 1.25rem;
        font-size: 0.8rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>Sem conexão com a internet</h1>
      <p>
        O aplicativo <strong>BR3 Tech</strong> precisa de conexão com a rede para sincronizar novos dados. Verifique seu Wi-Fi ou dados móveis e tente novamente.
      </p>
      <button class="btn" onclick="window.location.reload()">
        Tentar reconectar
      </button>
      <div class="status" id="status-text">Modo offline ativo</div>
    </div>
    <script>
      window.addEventListener('online', () => {
        document.getElementById('status-text').textContent = 'Conexão restabelecida! Recarregando...';
        setTimeout(() => window.location.reload(), 1000);
      });
    </script>
  </body>
</html>
